<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>RapidBay</title>
        <link rel="manifest" href="/manifest.json" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #141414;
                color: #fff;
                font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
            }
            form {
                width: 100%;
                max-width: 320px;
                padding: 0 20px;
                box-sizing: border-box;
                text-align: center;
            }
            .logo {
                display: block;
                width: 160px;
                margin: 0 auto 28px;
            }
            label {
                display: block;
                margin-bottom: 6px;
                text-align: left;
                font-size: 14px;
                color: rgba(255, 255, 255, 0.8);
            }
            input,
            button {
                width: 100%;
                box-sizing: border-box;
                font: inherit;
                font-size: 18px;
                border-radius: 6px;
            }
            input {
                padding: 12px 14px;
                border: 1px solid rgba(255, 255, 255, 0.5);
                background: #000;
                color: #fff;
            }
            input::placeholder {
                color: rgba(255, 255, 255, 0.62);
            }
            button {
                margin-top: 14px;
                padding: 12px;
                border: 1px solid #fff;
                background: #fff;
                color: #000;
                font-weight: 700;
                cursor: pointer;
            }
            input:focus-visible,
            button:focus-visible {
                outline: 2px solid #2a9fd6;
                outline-offset: 2px;
            }
            .error {
                min-height: 20px;
                margin: 12px 0 0;
                font-size: 14px;
                color: #ff6b6b;
            }
        </style>
    </head>

    <body>
        <form>
            <img class="logo" src="/lib/rapidbay-logo.png" alt="RapidBay" />
            <label for="password">Password</label>
            <input
                id="password"
                type="text"
                autofocus
                autocorrect="off"
                autocapitalize="none"
            />
            <button type="submit">Continue</button>
            <p class="error" id="error" role="alert"></p>
        </form>
        <script>
            var storedCookie = localStorage.getItem("cookie");
            var form = document.getElementsByTagName("form")[0];
            if (storedCookie && !document.cookie) {
                document.cookie = storedCookie;
                location.reload();
            } else if (storedCookie) {
                localStorage.removeItem("cookie");
            }
            form.onsubmit = function (e) {
                e.preventDefault();
                var password = document.getElementsByTagName("input")[0].value;
                if (!password) return;
                var error = document.getElementById("error");
                error.textContent = "";
                fetch("/api", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({ password: password }).toString(),
                })
                    .then(function (response) {
                        if (!response.ok) throw new Error("status " + response.status);
                        var cookieHeader = response.headers.get("x-set-cookie");
                        if (!cookieHeader) {
                            error.textContent = "That password didn't work. Try again.";
                            return;
                        }
                        if (!document.cookie) {
                            document.cookie = cookieHeader;
                        } else {
                            localStorage.setItem("cookie", cookieHeader);
                        }
                        location.reload();
                    })
                    .catch(function () {
                        error.textContent = "Couldn't reach the server. Try again.";
                    });
            };
            if (navigator.serviceWorker) {
                navigator.serviceWorker.register("/sw.js");
            }
            document.addEventListener(
                "keydown",
                function (e) {
                    var name = e.key;
                    var lowername = name.toLowerCase();
                    if (lowername === "arrowdown") {
                        document.getElementsByTagName("input")[0].focus();
                    }
                },
                true
            );
        </script>
    </body>
</html>
